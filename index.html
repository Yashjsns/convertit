    <title>ConvertIt - Immersive Document & Image Suite</title>
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if (typeof window.global === 'undefined') {
            window.global = window;
          }
          if (typeof window.Iterator === 'undefined') {
            class Iterator {}
            window.Iterator = Iterator;
            if (typeof globalThis !== 'undefined') {
              globalThis.Iterator = Iterator;
            }
          }
          if (typeof Promise.withResolvers === 'undefined') {
            Promise.withResolvers = function () {
              var resolve, reject;
              var promise = new Promise(function (res, rej) {
                resolve = res;
                reject = rej;
              });
              return { promise: promise, resolve: resolve, reject: reject };
            };
          }
          try {
            var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
            var currentFetch = nativeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch || nativeFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // Ignore if environment strictly seals window
          }
        }
      })();
    </script>
